<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to easyACR</title>
  </head>
  <body style="margin:0;background:#f7f7f5;color:#171716;font-family:Arial,sans-serif;">
    <main style="max-width:560px;margin:0 auto;padding:48px 24px;">
      <h1 style="margin:0 0 16px;font-size:28px;line-height:1.2;">Sign in to easyACR</h1>
      <p style="margin:0 0 24px;font-size:16px;line-height:1.5;">Use this secure link to continue to your accessibility review workspace.</p>
      <p style="margin:0 0 32px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 20px;border-radius:6px;background:#171716;color:#ffffff;font-weight:700;text-decoration:none;">Sign in to easyACR</a></p>
      <p style="margin:0;font-size:13px;line-height:1.5;color:#5f5f5b;">If you did not request this email, you can safely ignore it.</p>
    </main>
  </body>
</html>
